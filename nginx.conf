server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Текстовый файл с ключом Yandex Maps, кладётся CMD'ом контейнера.
    location = /api-key.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # Статика с длинным кэшем — у Vite уже хеши в имени файла.
    location ~* \.(?:js|mjs|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: любой неизвестный путь отдаём index.html,
    # иначе после F5 на /game и т.п. будет 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем, чтобы новый билд подхватывался сразу.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
